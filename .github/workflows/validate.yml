name: Validate site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica file essenziali
        run: |
          set -euo pipefail
          test -f index.html
          test -f .nojekyll
          test -f css/style.css
          test -f js/main.js
          test -f data/pokemon.json
          test -f data/words-answers.txt
          test -f data/words-guesses.txt
          test -f data/dishes.json
          test -f data/jokes.json
          test -f data/facts.json
          test -f data/picross.json
          test -f data/crosswords.json
          test -f js/dish.js
          python3 - <<'PY'
          import json, pathlib
          json.loads(pathlib.Path("data/pokemon.json").read_text())
          dishes = json.loads(pathlib.Path("data/dishes.json").read_text())
          assert len(dishes) >= 30
          assert all(
              d.get("dish") and d.get("country") and d.get("blurb") and d.get("image")
              and d.get("continent") in {"Europa", "Americhe", "Asia", "Africa", "Oceania"}
              and pathlib.Path(d["image"]).is_file()
              for d in dishes
          )
          json.loads(pathlib.Path("data/jokes.json").read_text())
          facts = json.loads(pathlib.Path("data/facts.json").read_text())
          assert facts and all(
              f.get("claim") and f.get("fact") and isinstance(f.get("isTrue"), bool)
              for f in facts
          )
          pic = json.loads(pathlib.Path("data/picross.json").read_text())
          assert pic and all(p.get("size") == 10 and len(p.get("grid", [])) == 100 for p in pic)
          xw = json.loads(pathlib.Path("data/crosswords.json").read_text())
          assert xw and all(len(p.get("grid", [])) >= 9 for p in xw)
          answers = pathlib.Path("data/words-answers.txt").read_text().splitlines()
          assert answers and all(len(w) == 5 for w in answers if w)
          print("OK: dati validi")
          PY
